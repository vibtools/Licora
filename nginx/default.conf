server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";

    # Global restrictions
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # CRITICAL: Deny access to sensitive files and directories
    location ~ \.(env|pem|key|sql|lock|log|ini|sh|md|git|patch)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /includes/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /cron/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /scripts/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /audit/ {
        deny all;
        return 404;
    }

    location ^~ /tests/ {
        deny all;
        return 404;
    }

    # Handle direct access to installer (if user hasn't disabled it)
    # We allow /install/index.php and /install.php but it's recommended to remove them.

    # Regular PHP execution
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
