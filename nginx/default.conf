server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy (CSP):
    # Allows self for default, scripts, styles. Unsafe-inline is often needed by legacy UI plugins unless refactored.
    # Adjust as needed if frontend breaks, but this is a solid baseline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;
    
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Global restrictions
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # CRITICAL: Deny access to sensitive files and directories
    location ~ \.(env|pem|key|sql|lock|log|ini|sh|md|git|patch)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /includes/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /cron/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /scripts/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /audit/ {
        deny all;
        return 404;
    }

    location ^~ /tests/ {
        deny all;
        return 404;
    }

    # Regular PHP execution
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
