services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - keys_volume:/var/www/keys
    environment:
      - APP_ENV=${APP_ENV?Required APP_ENV}
      - APP_URL=${APP_URL?Required APP_URL}
      - LICENSE_DB_HOST=db
      - LICENSE_DB_PORT=3306
      - LICENSE_DB_NAME=${LICENSE_DB_NAME?Required Database Name}
      - LICENSE_DB_USER=${LICENSE_DB_USER?Required Database User}
      - LICENSE_DB_PASS=${LICENSE_DB_PASS?Required Database Password}
      - LICENSE_APP_KEY=${LICENSE_APP_KEY?Required APP_KEY}
      - LICENSE_ENCRYPTION_KEY=${LICENSE_ENCRYPTION_KEY?Required ENCRYPTION_KEY}
      - LICENSE_CSRF_SECRET=${LICENSE_CSRF_SECRET?Required CSRF_SECRET}
      - LICENSE_JWT_SECRET=${LICENSE_JWT_SECRET?Required JWT_SECRET}
      - LICENSE_V2_SIGNING_PRIVATE_KEY_PATH=/var/www/keys/private.pem
      - LICENSE_V2_SIGNING_PUBLIC_KEY_PATH=/var/www/keys/public.pem
      - LICORA_UPDATE_CHECK_INTERVAL=0
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/healthcheck.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    # Do not expose the port to the host for security.
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - MARIADB_DATABASE=${LICENSE_DB_NAME?Required Database Name}
      - MARIADB_USER=${LICENSE_DB_USER?Required Database User}
      - MARIADB_PASSWORD=${LICENSE_DB_PASS?Required Database Password}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD?Required MariaDB Root Password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 3

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - keys_volume:/var/www/keys
    environment:
      - APP_ENV=${APP_ENV?Required APP_ENV}
      - LICENSE_DB_HOST=db
      - LICENSE_DB_PORT=3306
      - LICENSE_DB_NAME=${LICENSE_DB_NAME?Required Database Name}
      - LICENSE_DB_USER=${LICENSE_DB_USER?Required Database User}
      - LICENSE_DB_PASS=${LICENSE_DB_PASS?Required Database Password}
      - LICENSE_APP_KEY=${LICENSE_APP_KEY?Required APP_KEY}
      - LICENSE_ENCRYPTION_KEY=${LICENSE_ENCRYPTION_KEY?Required ENCRYPTION_KEY}
      - LICENSE_CSRF_SECRET=${LICENSE_CSRF_SECRET?Required CSRF_SECRET}
      - LICENSE_JWT_SECRET=${LICENSE_JWT_SECRET?Required JWT_SECRET}
      - LICENSE_V2_SIGNING_PRIVATE_KEY_PATH=/var/www/keys/private.pem
      - LICENSE_V2_SIGNING_PUBLIC_KEY_PATH=/var/www/keys/public.pem
    command: ["crond", "-f", "-d", "8"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  keys_volume:
