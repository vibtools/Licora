services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - keys_volume:/var/www/keys
    environment:
      - APP_ENV=${APP_ENV}
      - APP_URL=${APP_URL}
      - LICENSE_DB_HOST=db
      - LICENSE_DB_PORT=3306
      - LICENSE_DB_NAME=${LICENSE_DB_NAME}
      - LICENSE_DB_USER=${LICENSE_DB_USER}
      - LICENSE_DB_PASS=${LICENSE_DB_PASS}
      - LICENSE_APP_KEY=${LICENSE_APP_KEY}
      - LICENSE_ENCRYPTION_KEY=${LICENSE_ENCRYPTION_KEY}
      - LICENSE_CSRF_SECRET=${LICENSE_CSRF_SECRET}
      - LICENSE_JWT_SECRET=${LICENSE_JWT_SECRET}
      - LICENSE_V2_SIGNING_PRIVATE_KEY_PATH=/var/www/keys/private.pem
      - LICENSE_V2_SIGNING_PUBLIC_KEY_PATH=/var/www/keys/public.pem
      - LICORA_UPDATE_CHECK_INTERVAL=0
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/healthcheck.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/mariadb.Dockerfile
    restart: unless-stopped
    # Do not expose the port to the host for security.
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=${LICENSE_DB_NAME}
      - MARIADB_USER=${LICENSE_DB_USER}
      - MARIADB_PASSWORD=${LICENSE_DB_PASS}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 3

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - keys_volume:/var/www/keys
    environment:
      - APP_ENV=${APP_ENV}
      - LICENSE_DB_HOST=db
      - LICENSE_DB_PORT=3306
      - LICENSE_DB_NAME=${LICENSE_DB_NAME}
      - LICENSE_DB_USER=${LICENSE_DB_USER}
      - LICENSE_DB_PASS=${LICENSE_DB_PASS}
      - LICENSE_APP_KEY=${LICENSE_APP_KEY}
      - LICENSE_ENCRYPTION_KEY=${LICENSE_ENCRYPTION_KEY}
      - LICENSE_CSRF_SECRET=${LICENSE_CSRF_SECRET}
      - LICENSE_JWT_SECRET=${LICENSE_JWT_SECRET}
      - LICENSE_V2_SIGNING_PRIVATE_KEY_PATH=/var/www/keys/private.pem
      - LICENSE_V2_SIGNING_PUBLIC_KEY_PATH=/var/www/keys/public.pem
    command: ["/bin/sh", "-c", "crond -f -d 8"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  keys_volume:
