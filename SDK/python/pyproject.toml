[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licora"
version = "1.0.0"
description = "Production Python client SDK for Licora Secure API v2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vib Tools", email = "hello@vib.tools"}]
keywords = ["licensing", "license-management", "desktop", "device-authentication", "licora"]
dependencies = [
  "cryptography>=42,<47",
  "requests>=2.31,<3",
  "keyring>=24,<27; platform_system != 'Windows'",
  "tzdata>=2024.1; platform_system == 'Windows'",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://vib.tools"
Documentation = "https://github.com/vibtools/Licora/tree/main/SDK/python"
Repository = "https://github.com/vibtools/Licora"
Issues = "https://github.com/vibtools/Licora/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
licora_sdk = ["py.typed"]
