name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: licora-release-test
          MYSQL_DATABASE: licora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plicora-release-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, json, curl, zip
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release tag and source version
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "env_value('APP_VERSION', '${version}')" includes/config.php
          test -f "RELEASE_NOTES_${tag}.md"

      - name: Full source verification
        run: python3 scripts/verify-local.py

      - name: API v2 and updater database integration
        env:
          LICORA_V2_TEST_ALLOW_SCHEMA_RESET: '1'
          LICORA_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=licora_test;charset=utf8mb4
          LICORA_TEST_DB_USER: root
          LICORA_TEST_DB_PASS: licora-release-test
          LICENSE_DB_HOST: 127.0.0.1
          LICENSE_DB_PORT: '3306'
          LICENSE_DB_NAME: licora_test
          LICENSE_DB_USER: root
          LICENSE_DB_PASS: licora-release-test
        run: |
          php tests/api_v2_db_integration.php
          php tests/admin_v2_ui_db_integration.php
          php tests/updater_db_integration.php

      - name: Build exact-tag release ZIP and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          bash scripts/package-release.sh "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "release/Licora-${version}.zip"

      - name: Build signed updater manifest
        env:
          LICORA_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.LICORA_UPDATE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "${LICORA_UPDATE_SIGNING_PRIVATE_KEY:-}" || { echo "Repository secret LICORA_UPDATE_SIGNING_PRIVATE_KEY is required." >&2; exit 1; }
          private_key="$RUNNER_TEMP/licora-update-signing-private.pem"
          printf '%s' "$LICORA_UPDATE_SIGNING_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -outform DER > "$RUNNER_TEMP/private-derived-public.der"
          openssl pkey -pubin -in includes/updater/update-signing-public.pem -outform DER > "$RUNNER_TEMP/tracked-public.der"
          cmp "$RUNNER_TEMP/private-derived-public.der" "$RUNNER_TEMP/tracked-public.der"
          python3 scripts/build-update-manifest.py \
            --version "$version" \
            --ref "$GITHUB_REF_NAME" \
            --package "release/Licora-${version}.zip" \
            --output release/licora-update-manifest.json
          openssl dgst -sha256 -sign "$private_key" -out release/licora-update-manifest.sig release/licora-update-manifest.json
          openssl dgst -sha256 -verify includes/updater/update-signing-public.pem -signature release/licora-update-manifest.sig release/licora-update-manifest.json
          php scripts/verify-release-update.php \
            --version "$version" \
            --package "release/Licora-${version}.zip" \
            --manifest release/licora-update-manifest.json \
            --signature release/licora-update-manifest.sig
          rm -f "$private_key" "$RUNNER_TEMP/private-derived-public.der" "$RUNNER_TEMP/tracked-public.der"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/Licora-${version}.zip" \
            "release/Licora-${version}.zip.sha256" \
            "release/licora-update-manifest.json" \
            "release/licora-update-manifest.sig" \
            --verify-tag \
            --title "Licora ${GITHUB_REF_NAME}" \
            --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md" \
            --latest
