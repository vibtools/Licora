name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php-version }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, openssl, json, curl, zip
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify repository
        run: python3 scripts/verify-local.py

  mysql-integration:
    name: API v2 + updater + dashboard MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: licora-test-root
          MYSQL_DATABASE: licora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plicora-test-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, json, curl, zip
          coverage: none

      - name: Run API v2 database integration
        env:
          LICORA_V2_TEST_ALLOW_SCHEMA_RESET: '1'
          LICORA_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=licora_test;charset=utf8mb4
          LICORA_TEST_DB_USER: root
          LICORA_TEST_DB_PASS: licora-test-root
          LICENSE_DB_HOST: 127.0.0.1
          LICENSE_DB_PORT: '3306'
          LICENSE_DB_NAME: licora_test
          LICENSE_DB_USER: root
          LICENSE_DB_PASS: licora-test-root
        run: |
          php tests/api_v2_db_integration.php
          php tests/admin_v2_ui_db_integration.php
          php tests/updater_db_integration.php
          php tests/dashboard_db_integration.php

  windows-python-contract:
    name: Windows Python builder portability
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify builder portability
        run: python tests/updater_builder_contract.py

  package:
    name: Build verified source artifact
    needs: [validate, mysql-integration, windows-python-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, json, curl, zip
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build source ZIP and checksum
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          mkdir -p release
          bash scripts/package-release.sh v5.6.0 "$GITHUB_SHA" "release/Licora-5.6.0-ci-${short_sha}.zip"
          cp "release/Licora-5.6.0-ci-${short_sha}.zip" "release/Licora-5.6.0.zip"
          python3 scripts/build-update-manifest.py --version 5.6.0 --ref "$GITHUB_SHA" --package "release/Licora-5.6.0.zip" --output release/licora-update-manifest.json
          rm "release/Licora-5.6.0.zip"

      - name: Upload CI release-candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: Licora-5.6.0-${{ github.sha }}
          path: |
            release/Licora-5.6.0-ci-*.zip
            release/Licora-5.6.0-ci-*.zip.sha256
            release/licora-update-manifest.json
          if-no-files-found: error
          retention-days: 14
